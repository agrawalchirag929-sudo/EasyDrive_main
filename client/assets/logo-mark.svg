<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="easydrive-logo-mark" aria-hidden="true">
  <!-- EasyDrive Car Silhouette Mark -->
  <!-- Car Roof & Windows -->
  <path 
    d="M17 31 L24 18 C24.8 16.8 26.2 16 27.6 16 H39 C40.4 16 41.8 16.8 42.6 18 L50 31 Z" 
    fill="var(--logo-window, #101820)" 
    stroke="var(--brand, #D97736)" 
    stroke-width="2.5" 
    stroke-linejoin="round"
  />
  
  <!-- Window Divider Pillar -->
  <line 
    x1="33" y1="16" x2="33" y2="31" 
    stroke="var(--brand, #D97736)" 
    stroke-width="2.5" 
    stroke-linecap="round"
  />

  <!-- Main Body Shell -->
  <path 
    d="M7 36 C7 33.2 9.2 31 12 31 H54 C57 31 59.5 33.4 59.8 36.4 L61 44 C61.2 45.7 59.8 47 58.1 47 H53.5 A6.5 6.5 0 0 0 40.5 47 H23.5 A6.5 6.5 0 0 0 10.5 47 H5.9 C4.2 47 2.8 45.7 3 44 Z" 
    fill="var(--surface, #FFFFFF)" 
    stroke="var(--brand, #D97736)" 
    stroke-width="2.5" 
    stroke-linejoin="round"
  />

  <!-- Headlight & Taillight Accents -->
  <path d="M57 37 L53 37" stroke="var(--brand, #D97736)" stroke-width="2" stroke-linecap="round" />
  <path d="M7 37 L11 37" stroke="var(--brand, #D97736)" stroke-width="2" stroke-linecap="round" />

  <!-- Rear Wheel (outer ring, rim, hub) -->
  <circle cx="17" cy="47" r="6" fill="var(--logo-wheel, #F5F3EE)" stroke="var(--logo-ring, #101820)" stroke-width="2.5" />
  <circle cx="17" cy="47" r="2.5" fill="var(--brand, #D97736)" />

  <!-- Front Wheel (outer ring, rim, hub) -->
  <circle cx="47" cy="47" r="6" fill="var(--logo-wheel, #F5F3EE)" stroke="var(--logo-ring, #101820)" stroke-width="2.5" />
  <circle cx="47" cy="47" r="2.5" fill="var(--brand, #D97736)" />
</svg>
